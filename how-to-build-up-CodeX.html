<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《动手学 CodeX 部署》· 学习卡原型</title>
<style>
:root{
  --paper:#f5f6fd; --card:#ffffff;
  --ink:#16173a; --ink2:rgba(22,23,60,.78); --muted:rgba(22,23,60,.55); --faint:#8b8dab;
  --line:rgba(22,23,60,.11); --line2:rgba(22,23,60,.06);
  --soft:#ebeafa; --soft2:#f5f6fd;
  --accent:#5b6bf7; --accent2:#4252e6; --accent-soft:#e6e8fd; --accent-line:#d5d9fb;
  --lav:#a6a5fe; --lav2:#7597fe;
  --grad:linear-gradient(145deg,#aaa8ff 0%,#8b9bff 38%,#5b6bf7 100%);
  --ok:#2f8f6b; --ok-soft:#e6f3ee; --warn:#a8701a; --bad:#c0453a;
  --ink-solid:#1b1c38;
  --r:14px;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --slap:cubic-bezier(.34,1.28,.42,1);
  --mono:"SFMono-Regular",ui-monospace,Consolas,"JetBrains Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-size:14px;line-height:1.75;overflow:hidden;
  font-family:Geist,"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:radial-gradient(820px 420px at 80% -12%, rgba(166,165,254,.28) 0%, rgba(166,165,254,0) 70%),
             radial-gradient(620px 380px at 4% 18%, rgba(190,193,255,.22) 0%, rgba(190,193,255,0) 70%),
             var(--paper);
  background-attachment:fixed;
}
h1,h2,h3,h4,p,ul,ol{margin:0}
h1,h2,h3{letter-spacing:-.045em}
b,strong{font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:background .16s,color .16s,transform .3s var(--ease)}
[hidden]{display:none !important}
::selection{background:#ccd1fb}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

 
.side-hot{position:fixed;left:0;top:0;bottom:0;width:20px;z-index:69}
.side-rail{
  position:fixed;left:0;top:0;bottom:0;width:78px;z-index:70;
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 20px;
  background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(246,247,255,.86));
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border-right:1px solid rgba(22,23,60,.06);
  box-shadow:18px 0 44px -30px rgba(22,23,60,.4), inset -1px 0 0 rgba(255,255,255,.8);
  transform:translateX(-104%);
  transition:transform .62s var(--ease);
}
.side-rail.open{transform:none}
.side-btn{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  color:rgba(22,23,60,.55);position:relative;
}
.side-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.side-btn:hover{color:var(--accent);background:rgba(230,232,253,.7)}
.side-btn::after{
  content:attr(data-label);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(-4px);
  background:rgba(22,23,60,.9);color:#fff;font-size:10.5px;letter-spacing:.03em;padding:4px 9px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:.2s var(--ease);
}
.side-btn:hover::after{opacity:1;transform:translateY(-50%)}
.side-rail.open .side-btn::after{opacity:0}
.ital-i{font-family:Georgia,"Times New Roman","Songti SC",serif;font-style:italic;font-size:29px;line-height:1;
  margin-top:-6px;letter-spacing:0;font-weight:400}
.side-collapse{margin-top:auto;color:rgba(22,23,60,.42)}
.side-collapse svg{width:18px;height:18px}

 
.stage{position:absolute;inset:0;z-index:10;padding:0 200px 0 60px}
@media (max-width:1180px){ .stage{padding:0 170px 0 40px} }

 
.deck{
  position:absolute;left:50%;top:50%;width:min(520px,44vw);height:338px;
  transform:translate(-50%,-50%);
  transition:transform .86s var(--ease);
}
.deck.open{transform:translate(-50%,-50%) translateY(-35vh) scale(.46)}
.deck.open .l1,.deck.open .l2{opacity:0;transform:translate(-6px,-12px) scale(.99)}
.lcard{
  position:absolute;inset:0;display:flex;flex-direction:column;padding:26px 28px 20px;border-radius:20px;
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(24px) saturate(175%);
  backdrop-filter:blur(24px) saturate(175%);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 34px 64px -46px rgba(22,23,60,.6), inset 0 1px 0 #fff;
  transition:transform .62s var(--ease), opacity .5s var(--ease), box-shadow .4s;
  will-change:transform;
}
.lcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(100% 60% at 106% -18%, rgba(166,165,254,.14), transparent 52%)}
.l0{transform:rotate(-.5deg);z-index:3;cursor:default}
.l1{transform:translate(-22px,-38px) scale(.958) rotate(-1.9deg);opacity:.94;z-index:2}
.l2{transform:translate(-42px,-70px) scale(.918) rotate(-3.5deg);opacity:.78;z-index:1}
.card-top{position:relative;z-index:1;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint)}
.card-top .no{color:var(--accent);font-weight:600}
.card-top .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.45}
.card-top .time{margin-left:auto;letter-spacing:.05em}
.lcard h2{position:relative;z-index:1;font-size:23px;font-weight:550;letter-spacing:-.04em;line-height:1.3;margin:15px 0 7px}
.card-lede{position:relative;z-index:1;font-size:11.8px;line-height:1.75;color:rgba(22,23,60,.55);margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.subs{position:relative;z-index:1;list-style:none;display:flex;flex-direction:column;margin-top:2px}
.subs li{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 2px;border-bottom:1px solid rgba(22,23,60,.07);
  cursor:pointer;border-radius:6px;transition:background .16s,padding .2s var(--ease)}
.subs li:last-child{border-bottom:0}
.subs li:hover{background:rgba(230,232,253,.6);padding-left:8px;padding-right:2px}
.subs li b{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--accent);opacity:.85;width:22px;flex:none}
.subs li span{font-size:12.5px;color:rgba(22,23,60,.7);flex:1}
.subs li:hover span{color:var(--accent)}
.subs li i{font-style:normal;font-size:12px;color:var(--accent);opacity:0;transform:translateX(-4px);transition:.2s var(--ease)}
.subs li:hover i{opacity:1;transform:none}
.card-foot{position:relative;z-index:1;margin-top:auto;display:flex;align-items:center;gap:10px;
  font-size:9.5px;letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.card-foot .bar{flex:1;height:3px;border-radius:99px;background:rgba(22,23,60,.09);overflow:hidden}
.card-foot .bar em{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s var(--ease)}
.card-foot b{font-family:var(--mono);font-size:10.5px;color:rgba(22,23,60,.72);letter-spacing:0;text-transform:none}

 
.lcard.tear{position:fixed;pointer-events:none;z-index:80;will-change:transform;
  transition:opacity .5s var(--ease),filter .6s;
  animation:tearFly .9s cubic-bezier(.55,.03,.28,1) forwards}
@keyframes tearFly{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  28%{transform:translate(calc(var(--dx) * .3), calc(var(--dy) * .18 - 26px)) scale(.79) rotate(-3.4deg)}
  100%{transform:translate(var(--dx), var(--dy)) scale(var(--s)) rotate(1.2deg)}
}

 
.rail{position:absolute;right:34px;top:74px;width:186px;display:flex;flex-direction:column;gap:10px;z-index:4}
.rail-item{
  position:relative;width:186px;flex:none;padding:0;border:0;background:transparent;
  border-radius:9px;overflow:hidden;transform-origin:top right;
  box-shadow:0 14px 26px -22px rgba(22,23,60,.7);
  transition:transform .5s var(--ease),opacity .4s var(--ease),margin .5s var(--ease),box-shadow .3s;
  animation:railIn .45s var(--ease) both;
}
@keyframes railIn{from{opacity:0;transform:scale(.9) translateX(10px)}to{opacity:1}}
.rail-mini{position:absolute;top:0;left:0;display:block;transform-origin:top left;pointer-events:none}
.lcard.mini{position:absolute;inset:0;transform:none;border-radius:18px;pointer-events:none}
.rail-item:hover{box-shadow:0 22px 36px -20px rgba(91,107,247,.85)}

 
.neck{
  position:absolute;left:50%;top:calc(30vh - 56px);width:46px;height:8px;border-radius:50%;
  background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.98) 32%, rgba(255,255,255,.98) 68%, rgba(255,255,255,0));filter:blur(7px);z-index:5;opacity:0;pointer-events:none;
  transform:translateX(-50%) scaleX(.6);
  transition:opacity .34s var(--ease),transform .5s var(--slap),height .5s var(--slap);
}
.neck.on{opacity:1;height:62px;transform:translateX(-50%) scaleX(1)}

.detail{
  position:absolute;left:50%;top:30vh;z-index:6;transform-origin:top center;
  width:min(660px,52vw);max-height:min(47vh,440px);
  border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  background:rgba(255,255,255,.84);
  -webkit-backdrop-filter:blur(28px) saturate(185%);
  backdrop-filter:blur(28px) saturate(185%);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 50px 90px -60px rgba(22,23,60,.75), inset 0 1px 0 #fff;
  opacity:0;pointer-events:none;
  transform:translateX(-50%) scale(.92);
  transition:opacity .3s var(--ease),transform .34s var(--ease);
}
.detail.on{
  opacity:1;pointer-events:auto;
  transform:translateX(-50%) scale(1);
  animation:splitOpen .84s var(--slap) both;
}
@keyframes splitOpen{
  0%{opacity:0;filter:blur(16px);transform:translateX(-50%) scale(.30,.015);border-radius:64px}
  36%{opacity:1;filter:blur(6px)}
  70%{filter:blur(0);transform:translateX(-50%) scale(1.012,.99);border-radius:22px}
  100%{filter:blur(0);transform:translateX(-50%) scale(1);border-radius:20px}
}
.detail-body::-webkit-scrollbar,.sheet-list::-webkit-scrollbar{width:6px}
.detail-body::-webkit-scrollbar-thumb,.sheet-list::-webkit-scrollbar-thumb{background:rgba(22,23,60,.16);border-radius:99px}
.detail-body::-webkit-scrollbar-track,.sheet-list::-webkit-scrollbar-track{background:transparent}
.detail-head{display:flex;align-items:flex-start;gap:14px;padding:20px 24px 16px;border-bottom:1px solid rgba(22,23,60,.08);flex:none;
  animation:headIn .42s var(--ease) both}
@keyframes headIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.detail.swap .detail-head,.detail.swap .detail-body{opacity:0;transform:translateY(-14px);animation:none;
  transition:opacity .15s var(--ease),transform .18s var(--ease)}
.detail-head .kick{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--accent)}
.detail-head h3{font-size:18px;font-weight:550;letter-spacing:-.03em;margin-top:5px;line-height:1.4}
.detail-close{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:rgba(22,23,60,.45);flex:none}
.detail-close:hover{background:rgba(22,23,60,.06);color:var(--ink)}
.detail-close svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.detail-body{padding:14px 24px 22px;overflow:auto;flex:1;min-height:0;animation:bodyIn .44s var(--ease) both}
@keyframes bodyIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.detail-body p{font-size:12.8px;color:rgba(22,23,60,.72);margin-bottom:10px;line-height:1.9}
.detail-body p:last-child{margin-bottom:0}
.detail-body ul.dot{list-style:none;display:grid;gap:6px;margin:4px 0 10px}
.detail-body ul.dot li{font-size:12.2px;color:rgba(22,23,60,.72);padding-left:14px;position:relative;line-height:1.85}
.detail-body ul.dot li::before{content:"";position:absolute;left:2px;top:10px;width:4px;height:4px;border-radius:50%;background:#c9cbf0}
.detail-body b.hl{color:var(--ink);font-weight:600}
table.mini{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
table.mini th,table.mini td{padding:9px 12px;font-size:11.6px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.7}
table.mini th{background:#f7f8fe;font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
table.mini tr:last-child td{border-bottom:0}
table.mini td:first-child{font-weight:550;white-space:nowrap}
code.inl{font-family:var(--mono);font-size:11px;background:#eef0fb;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:#3d4180;white-space:nowrap}

 
.codeblock{background:#f7f8fe;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.code-head{display:flex;align-items:center;gap:6px;padding:8px 13px;background:#eef0fb;border-bottom:1px solid var(--line)}
.code-head .d{width:5px;height:5px;border-radius:50%;background:#cfd3f0}
.code-lang{font-family:var(--mono);font-size:9px;color:#8f92b2;letter-spacing:.12em;text-transform:uppercase;margin-left:4px}
.copy{margin-left:auto;font-size:10px;color:#8f92b2;padding:3px 8px;border-radius:5px;border:1px solid var(--line);background:#fff}
.copy:hover{color:var(--accent);border-color:var(--accent-line)}
.codeblock pre{margin:0;padding:13px 15px;overflow:auto}
.codeblock code{font-family:var(--mono);font-size:11.4px;line-height:1.9;color:#2a2c55;white-space:pre;display:block}
.codeblock .cm{color:#9295b3}
.code-wrap .codeblock{border-radius:10px 10px 0 0;margin-bottom:0}
.code-out{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:#f4f5fe;padding:9px 15px 12px}
.co-label{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.co-label::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--ok)}
.code-out pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.9;color:#3a3d68;white-space:pre-wrap}

 
.tabs{display:flex;gap:3px;margin:10px 0 8px;background:#ececfa;padding:3px;border-radius:8px;width:max-content;max-width:100%;flex-wrap:wrap}
.tabs button{padding:5px 11px;border-radius:6px;font-size:11px;font-weight:500;color:#8f92b2}
.tabs button.on{background:var(--accent);color:#fff}

 
.selfcheck{background:#fff;border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.sc-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#f7f8fe;border-bottom:1px solid var(--line)}
.sc-head b{font-size:11.5px;font-weight:600;display:block}
.sc-head span{font-size:10px;color:var(--faint);display:block}
.sc-head button{margin-left:auto;font-size:10.5px;padding:5px 11px;border-radius:6px;background:var(--accent);color:#fff}
.sc-head button:disabled{opacity:.5}
.sc-out{padding:11px 14px;font-family:var(--mono);font-size:11px;line-height:1.95;min-height:60px;background:#fafbff;color:#3a3d68}
.sc-idle{color:#9295b3;font-family:inherit;font-size:11.2px;margin:0;line-height:1.7}
.sc-line{display:flex;gap:9px;white-space:pre-wrap}
.sc-line .st{flex:none;font-weight:600}
.st.pass{color:var(--ok)}.st.warn{color:var(--warn)}.st.fail{color:var(--bad)}
.sc-sum{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink);font-weight:600}

 
.ck-block{margin-top:18px;border-top:1px solid rgba(22,23,60,.08);padding-top:14px}
.ck-title{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;font-weight:600}
.ck{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none}
.ck:last-child{border-bottom:0}
.ck .box{width:16px;height:16px;border-radius:4px;border:1px solid #d0d3eb;flex:none;display:grid;place-items:center;margin-top:3px;background:#fff;transition:.15s}
.ck .box svg{width:9px;height:9px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on .box{background:var(--ok);border-color:var(--ok)}
.ck.on .box svg{opacity:1}
.ck span.lbl{font-size:12px;color:rgba(22,23,60,.75);line-height:1.75}
.ck.on span.lbl{color:#9ea1bd;text-decoration:line-through;text-decoration-color:#d2d5ec}

 
.hint{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:40;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  opacity:0;transition:opacity .6s var(--ease);pointer-events:none;white-space:nowrap}
.hint.on{opacity:1}

 
.dock{position:fixed;left:50%;bottom:24px;z-index:85;display:flex;align-items:center;gap:2px;padding:8px;
  border-radius:22px;transform:translateX(-50%) scale(.97);
  background:rgba(255,255,255,.34);
  -webkit-backdrop-filter:blur(20px) saturate(155%);
  backdrop-filter:blur(20px) saturate(155%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 12px 30px -20px rgba(22,23,60,.4), inset 0 1px 0 rgba(255,255,255,.85);
  opacity:.9;
  transition:opacity .4s var(--ease), transform .6s var(--spring), background .45s var(--ease),
             box-shadow .45s var(--ease), border-color .45s var(--ease), backdrop-filter .45s var(--ease)}
.dock:hover,.dock:focus-within{opacity:1;transform:translateX(-50%) translateY(-3px) scale(1);
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.26));
  -webkit-backdrop-filter:blur(34px) saturate(200%) brightness(1.08) contrast(1.02);
  backdrop-filter:blur(34px) saturate(200%) brightness(1.08) contrast(1.02);
  border-color:rgba(255,255,255,.92);
  box-shadow:0 22px 50px -18px rgba(22,23,60,.5), 0 2px 8px rgba(22,23,60,.06),
             inset 0 1px 0 rgba(255,255,255,1), inset 0 -12px 26px rgba(122,132,246,.16)}
.dock::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(140deg,rgba(255,255,255,.98),rgba(255,255,255,.06) 42%,rgba(255,255,255,.8));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;opacity:0;transition:opacity .4s var(--ease)}
.dock:hover::before{opacity:1}
.dock::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  transition:opacity .35s var(--ease);mix-blend-mode:soft-light;
  background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.95), rgba(255,255,255,0) 60%)}
.dock:hover::after{opacity:1}
.dock-item{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  color:rgba(22,23,60,.6);transition:.24s var(--spring)}
.dock-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock-item:hover{background:rgba(255,255,255,.8);color:var(--accent);transform:translateY(-4px) scale(1.08)}
.dock-item.is-on{color:var(--accent);background:rgba(230,232,253,.88)}
.dock-item::after{content:attr(data-label);position:absolute;bottom:calc(100% + 12px);left:50%;
  transform:translateX(-50%) translateY(4px);background:rgba(22,23,60,.88);color:#fff;
  font-size:10.5px;letter-spacing:.04em;padding:4px 9px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.2s var(--ease)}
.dock-item:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
.dock-sep{width:1px;height:22px;background:rgba(22,23,60,.14);margin:0 5px}
.dock-prog{width:58px;display:flex;align-items:center;justify-content:center;gap:5px}
.dock-ring{width:23px;height:23px}
.dock-ring circle{transition:stroke-dashoffset .6s var(--ease)}
.dock-pct{font-size:10px;font-family:var(--mono);color:rgba(22,23,60,.72);letter-spacing:0;font-weight:500}
.dock-ital{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:21px;line-height:1;margin-top:-3px}

 
.sheet{position:fixed;inset:0;z-index:90;display:grid;place-items:end center;padding-bottom:96px}

const KEY = 'codex-cards-v1';
let state = { done:{}, open:false };
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw){ const p = JSON.parse(raw); if(p && p.done) state.done = p.done; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ done: state.done })); }catch(e){} }

function stepKey(tid,i){ return tid + ':' + i; }
function stepDone(t,i){ const a = state.done[stepKey(t.id,i)]; return Array.isArray(a) ? a.length : 0; }
function taskTotal(t){ return t.steps.reduce((n,s)=>n + (s.ck ? s.ck.length : 0), 0); }
function taskDone(t){ return t.steps.reduce((n,s,i)=>n + stepDone(t,i), 0); }
function totalItems(){ return TASKS.reduce((n,t)=>n + taskTotal(t), 0); }
function doneItems(){ return TASKS.reduce((n,t)=>n + taskDone(t), 0); }
function pct(){ const tot = totalItems(); return tot ? Math.round(doneItems()/tot*100) : 0; }
function taskPct(t){ const tot = taskTotal(t); return tot ? Math.round(taskDone(t)/tot*100) : 0; }

function cardHtml(t){
  return `<div class="card-top"><span class="no">TASK 0${t.no}</span><span class="dot"></span><span class="time">${t.time}</span></div>

    <div class="card-foot"><span>Checklist</span><i class="bar"><em style="width:${taskPct(t)}%"></em></i><b>${taskDone(t)}/${taskTotal(t)}</b></div>`;
}

function renderStack(fromBehind){

  ['c0','c1','c2'].forEach((id,i)=>{

    const t = list[i];
    if(!t){ el.style.display = 'none'; return; }
    el.style.display = '';
    el.dataset.t = t.no;
    el.innerHTML = cardHtml(t);
  });
  if(fromBehind){
    const front = document.getElementById('c0');
    front.style.transition = 'none';
    front.style.transform = 'translate(-22px,-38px) scale(.958)';
    front.style.opacity = '.55';
    front.getBoundingClientRect();
    front.style.transition = 'transform .9s cubic-bezier(.55,.03,.28,1), opacity .6s var(--ease)';
    front.style.transform = '';
    front.style.opacity = '';
    setTimeout(()=>{ front.style.transition=''; }, 950);
  }
}

 
function tearAway(taskNo){
  const cur = document.getElementById('c0');
  const r0 = cur.getBoundingClientRect();
  const rail = document.getElementById('rail');
  const rt = rail.getBoundingClientRect();
  const gap = 10, tw = rail.clientWidth || 186;
  const th = r0.height * (tw / r0.width);
  const n = rail.children.length;
  const targetTop = n ? (rt.top + n * (th + gap)) : rt.top;

  const clone = cur.cloneNode(true);
  clone.className = 'lcard tear';
  clone.style.left = r0.left + 'px';
  clone.style.top = r0.top + 'px';
  clone.style.width = r0.width + 'px';
  clone.style.height = r0.height + 'px';
  clone.style.transformOrigin = 'top left';
  document.body.appendChild(clone);

  const s = tw / r0.width;
  const dx = rt.left - r0.left;
  const dy = targetTop - r0.top;
  clone.style.setProperty('--dx', dx + 'px');
  clone.style.setProperty('--dy', dy + 'px');
  clone.style.setProperty('--s', s.toFixed(4));

  setTimeout(()=>{
    clone.remove();
    appendRail(taskNo, false);
  }, 900);
}

function appendRail(taskNo, animate){
  const rail = document.getElementById('rail');
  const t = TASKS.find(x=>x.no === taskNo);
  const c0 = document.getElementById('c0');
  const cw = c0.offsetWidth || 520, chh = c0.offsetHeight || 338;
  const sc = 186 / cw;
  const el = document.createElement('button');
  el.className = 'rail-item';
  el.dataset.t = taskNo;
  el.style.height = Math.round(chh * sc) + 'px';
  if(!animate) el.style.animation = 'none';
  el.innerHTML = `<span class="rail-mini" style="width:${cw}px;height:${chh}px;transform:scale(${sc})">
      <span class="lcard mini">${cardHtml(t)}</span></span>`;
  el.addEventListener('click', ()=> backTo(taskNo));
  rail.appendChild(el);
  wheelLayout();
}

function updateRailBars(){
  document.querySelectorAll('#rail .rail-item').forEach(el=>{
    const t = TASKS.find(x=>x.no === +el.dataset.t);
    if(!t) return;
    const em = el.querySelector('.card-foot .bar em');
    const b = el.querySelector('.card-foot b');
    if(em) em.style.width = taskPct(t) + '%';
    if(b) b.textContent = taskDone(t) + '/' + taskTotal(t);
  });
}

 
function wheelLayout(){
  const rail = document.getElementById('rail');
  const items = [...rail.children];
  const n = items.length;
  const availH = Math.max(320, window.innerHeight - 190);
  const baseH = items[0] ? items[0].offsetHeight : 120;
  const step = baseH + 10;
  const fit = Math.max(2, Math.floor(availH / step));
  const over = Math.max(0, n - fit);
  items.forEach((el,i)=>{
    const k = i < over ? (over - i) : 0;
    const s = Math.max(.42, 1 - k * .17);
    const o = Math.max(.2, 1 - k * .27);
    el.style.transform = `scale(${s})`;
    el.style.opacity = o;
    el.style.marginBottom = k ? `${-baseH * (1 - s)}px` : '0px';
    el.style.zIndex = String(20 - i);
  });
}

function backTo(taskNo){
  const idx = TASKS.findIndex(t=>t.no === taskNo);
  const rail = document.getElementById('rail');
  const items = [...rail.children];
  const pos = items.findIndex(el=> +el.dataset.t === taskNo);
  if(pos > -1) items.slice(pos).forEach(el=>el.remove());
  cardIdx = idx;
  closeDetail(true);
  renderStack();
  wheelLayout();
}

function flipNext(){
  if(cardIdx >= TASKS.length - 1){ toast('已经是最后一张卡片'); return; }
  closeDetail(true);
  const leaving = TASKS[cardIdx].no;
  cardIdx++;
  renderStack(true);
  tearAway(leaving);
  syncProgress();
}

function flipPrev(){
  if(cardIdx <= 0){ toast('已经是第一张卡片'); return; }
  const rail = document.getElementById('rail');
  if(rail.lastElementChild) rail.lastElementChild.remove();
  cardIdx--;
  closeDetail(true);
  renderStack();
  wheelLayout();
  syncProgress();
}




function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  const html = esc.replace(/^(#.*)$/gm, '<span class="cm">$1</span>');
  return `<div class="codeblock">
    <div class="code-head"><span class="d"></span><span class="d"></span><span class="d"></span>
      <span class="code-lang">${lang||'bash'}</span>
      <button class="copy" data-copy>复制</button>
    </div>
    <pre><code>${html}</code></pre>

}

function openDetail(si){
  const t = TASKS[cardIdx];
  if(!t.steps[si]) return;
  const d = document.getElementById('detail');
  if(!d.classList.contains('on')){
    d.style.setProperty('--dir', 1);
    renderDetail(si);
    d.classList.add('on');
    document.getElementById('hint').classList.remove('on');
    document.getElementById('deck').classList.add('open');
    document.getElementById('neck').classList.add('on');
    state.open = true;
    return;
  }
  if(+d.dataset.si === si) return;              
  d.classList.add('swap');                       
  setTimeout(()=>{
    renderDetail(si);                            
    d.classList.remove('swap');
  }, 170);
}

  pendingInd = ind ? { left: ind.offsetLeft, width: ind.offsetWidth } : null;
  d.style.setProperty('--dir', to > from ? 1 : -1);
  d.classList.add('swap');
  setTimeout(()=>{
    renderDetail(to);
    const b = d.querySelector('.detail-body');
    if(b) b.scrollTop = 0;
    d.classList.remove('swap');
  }, 158);
}

function bindDetail(){
  const d = document.getElementById('detail');
  d.querySelector('[data-dclose]').addEventListener('click', ()=> closeDetail(false));

  d.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const txt = btn.closest('.codeblock').querySelector('code').innerText;
      const ok = ()=>{ btn.textContent='已复制'; setTimeout(()=>btn.textContent='复制',1300); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(ok);
      else ok();
    });
  });

  d.querySelectorAll('.tabs [data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.closest('.tabs').parentElement;
      const i = btn.getAttribute('data-tab');
      wrap.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on', b===btn));
      wrap.querySelectorAll('[data-pane]').forEach(p=>{ p.hidden = p.getAttribute('data-pane') !== i; });
    });
  });

  const run = d.querySelector('[data-scrun]');
  if(run) run.addEventListener('click', ()=> runSelfCheck(run));

  
  const nav = d.querySelector('[data-nav]');
  const ind = d.querySelector('.sub-ind');
  const onTab = d.querySelector('.sub-tab.on');
  if(nav && ind && onTab){
    if(pendingInd){
      ind.style.transition = 'none';
      ind.style.left = pendingInd.left + 'px';
      ind.style.width = pendingInd.width + 'px';
      ind.getBoundingClientRect();
      ind.style.transition = '';
      pendingInd = null;
    }
    ind.style.left = onTab.offsetLeft + 'px';
    ind.style.width = onTab.offsetWidth + 'px';
    if(onTab.offsetLeft + onTab.offsetWidth > nav.clientWidth - 8){
      nav.scrollLeft = onTab.offsetLeft - 12;
    }
  }
  d.querySelectorAll('[data-subnav]').forEach(btn=>{
    btn.addEventListener('click', ()=> switchSub(+btn.dataset.subnav));
  });
  d.querySelectorAll('[data-pg]').forEach(btn=>{
    btn.addEventListener('click', ()=> switchSub(+(d.dataset.si) + (+btn.dataset.pg)));
  });

  d.querySelectorAll('[data-ck]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const key = row.dataset.key, i = +row.dataset.ck, ti = +row.dataset.ti;
      let arr = state.done[key] || [];
      if(arr.indexOf(i) > -1) arr = arr.filter(x=>x!==i); else arr = arr.concat(i);
      state.done[key] = arr;
      row.classList.toggle('on', arr.indexOf(i) > -1);
      save();
      const t = TASKS[cardIdx];
      const title = d.querySelector('.ck-title');
      if(title) title.textContent = '完成这一节 · ' + arr.length + '/' + t.steps[ti].ck.length;
      syncProgress();
      renderStack();
    });
  });
}

  { s:'PASS', t:'[2/6] 内存              16 GB' },
  { s:'WARN', t:'[3/6] 磁盘可用          12 GB  · 建议 ≥ 20 GB' },
  { s:'PASS', t:'[4/6] Node.js           v22.11.0' },

function runSelfCheck(btn){
  const out = btn.closest('.selfcheck').querySelector('[data-scout]');
  btn.disabled = true; btn.textContent = '检测中…';
  out.innerHTML = '';
  let i = 0;
  const tick = ()=>{
    if(i >= SC_LINES.length){
      const sum = document.createElement('div');
      sum.className = 'sc-sum';
      sum.textContent = '结论：5 PASS / 1 WARN / 0 FAIL —— 可以继续下一节';
      out.appendChild(sum);
      btn.textContent = '重新检测'; btn.disabled = false;
      return;
    }
    const L = SC_LINES[i];
    const row = document.createElement('div');
    row.className = 'sc-line';
    row.innerHTML = '<span class="st ' + L.s.toLowerCase() + '">' + L.s + '</span><span>' + L.t + '</span>';
    out.appendChild(row);
    i++; setTimeout(tick, 420);
  };
  tick();
}

function handleSelection(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed){ hideBubble(); return; }
  const text = sel.toString().trim();
  if(text.length < 4 || text.length > 600){ hideBubble(); return; }
  const range = sel.getRangeAt(0);
  let host = range.commonAncestorContainer;
  host = host.nodeType === 3 ? host.parentElement : host;
  if(!host || !host.closest('.detail, .lcard')){ hideBubble(); return; }

  selText = text;
  selRect = range.getBoundingClientRect();

  const b = document.getElementById('selBubble');
  b.hidden = false;
  const bw = 168;
  const bodyEl = document.querySelector('#detail .detail-body');
  const bodyTop = bodyEl ? bodyEl.getBoundingClientRect().top : 0;
  let left = selRect.left + selRect.width / 2 - bw / 2;
  left = Math.max(12, Math.min(window.innerWidth - bw - 12, left));
  let top = selRect.top - 44;
  if(top < 64 || top < bodyTop + 2) top = selRect.bottom + 10;
  b.style.left = left + 'px';
  b.style.top = top + 'px';
  requestAnimationFrame(()=> b.classList.add('on'));
}

function positionAI(){
  const card = document.getElementById('aiCard');
  const wasHidden = card.hidden;
  card.hidden = false;
  card.style.visibility = 'hidden';
  const w = card.offsetWidth || 384;
  const h = card.offsetHeight || 320;
  const r = selRect || { left: 240, top: 200, bottom: 260, width: 0 };
  const margin = 16, dockSafe = 100;
  
  let top = Math.min(r.bottom + 12, window.innerHeight - dockSafe - h);
  top = Math.max(margin, top);
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(margin, Math.min(window.innerWidth - w - margin, left));
  card.style.left = left + 'px';
  card.style.top = top + 'px';
  card.style.visibility = '';
  if(wasHidden) card.hidden = true;
}

  { sel:'#rail', pad:12, track:1300, title:'右侧是走过的卡',
    desc:'翻过去的卡会撕下来贴在这里，点它可以跳回去。放不下时，最上面的会按倍率缩小、变淡。',
    before(){ closeDetail(true); if(!document.querySelector('#rail .rail-item')) flipNext(); } },
  { sel:'#sideRail', pad:8, track:900, title:'左侧还藏着东西',
    desc:'鼠标贴到左边缘，侧栏会滑出来：主页与 inspiration 灵感社区。3 秒没操作会自动收起。',
    before(){ document.getElementById('sideRail').classList.add('open'); } },
  { sel:'#dock', pad:12, track:500, title:'底部是快捷导航',
    desc:'学习卡、inspired 大家都在问、进度环和重置都在这一条上。随时点右下角「?」可以再看一遍。' }
];

function placeTour(r){
  const card = document.getElementById('tourCard');
  const cw = card.offsetWidth || 302;
  const ch = card.offsetHeight || 168;
  const gap = 16, m = 14, dockSafe = 92;
  let left = r.left + r.width / 2 - cw / 2;
  let top = r.bottom + gap;
  if(r.left < 170){ left = r.right + gap; top = Math.max(m, r.top + 12); }
  else if(r.right > window.innerWidth - 110){ left = r.left - cw - gap; top = Math.max(m, r.top + 12); }
  if(top + ch > window.innerHeight - dockSafe) top = r.top - ch - gap;
  left = Math.max(m, Math.min(window.innerWidth - cw - m, left));
  top = Math.max(m, Math.min(window.innerHeight - ch - m, top));
  card.style.left = left + 'px';
  card.style.top = top + 'px';
}


 
let demoToken = 0;
async function demoSelect(){
  const my = ++demoToken;
  const body = document.querySelector('#detail .detail-body');
  if(!body) return;
  const p = body.querySelector('p');
  if(!p) return;
  const node = [...p.childNodes].find(n => n.nodeType === 3 && n.textContent.trim().length > 8);
  if(!node) return;

  const b = document.getElementById('selBubble');
  b.classList.remove('on');
  b.hidden = true;

  const len = Math.min(20, node.textContent.trim().length);
  const range = document.createRange();
  range.setStart(node, 0);
  range.setEnd(node, 0);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  
  for(let i = 1; i <= len; i++){
    if(my !== demoToken) return;
    range.setEnd(node, i);
    await delay(i < 4 ? 34 : 26);
  }
  if(my !== demoToken) return;
  await delay(120);

  selText = sel.toString().trim();
  selRect = range.getBoundingClientRect();

  const bw = 168;
  const bodyTop = body.getBoundingClientRect().top;
  const left = Math.max(12, Math.min(window.innerWidth - bw - 12, selRect.left + selRect.width / 2 - bw / 2));
  let top = selRect.top - 44;
  if(top < 64 || top < bodyTop + 2) top = selRect.bottom + 10;
  b.style.left = left + 'px';
  b.style.top = top + 'px';
  b.hidden = false;
  requestAnimationFrame(()=> b.classList.add('on'));
  await delay(260);
}

 
let trackToken = 0;
async function trackFor(sel, pad, ms){
  const my = ++trackToken;
  const hole = document.getElementById('tourHole');
  hole.style.transition = 'left .14s linear, top .14s linear, width .14s linear, height .14s linear, border-radius .24s, opacity .28s';
  const t0 = performance.now();
  while(performance.now() - t0 < ms && my === trackToken && tourActive){
    const el = document.querySelector(sel);
    if(el){
      const r = el.getBoundingClientRect();
      if(r.height > 2) applyHole(r, pad);
    }
    await delay(16);
  }
  if(my === trackToken) hole.style.transition = '';
}

 
async function settleRect(el, timeout){
  const t0 = performance.now();
  const limit = timeout || 1800;
  let prev = '';
  while(performance.now() - t0 < limit){
    const r = el.getBoundingClientRect();
    const key = [r.left, r.top, r.width, r.height].map(v => Math.round(v)).join(',');
    if(key === prev && r.height > 4) return r;
    prev = key;
    await delay(60);
  }
  return el.getBoundingClientRect();
}

function applyHole(r, pad, radius){
  const hole = document.getElementById('tourHole');
  hole.style.left = Math.round(r.left - pad) + 'px';
  hole.style.top = Math.round(r.top - pad) + 'px';
  hole.style.width = Math.round(r.width + pad * 2) + 'px';
  hole.style.height = Math.round(r.height + pad * 2) + 'px';
  hole.style.borderRadius = radius || '12px';
}

function drawTourCard(i){
  const st = TOUR[i];
  const card = document.getElementById('tourCard');
  card.innerHTML = `
    <div class="t-kick"><b>${String(i + 1).padStart(2, '0')}</b> / ${String(TOUR.length).padStart(2, '0')}
      <span class="t-tag">新手引导</span></div>
    <h4>${st.title}</h4>
    <p>${st.desc}</p>
    <div class="t-foot">
      <button class="t-skip" data-tourskip>跳过指南</button>
      <div class="t-dots">${TOUR.map((_, k)=>`<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <button class="t-next" data-tournext>${i === TOUR.length - 1 ? '完成' : '下一步'}</button>
    </div>`;
  card.querySelector('[data-tourskip]').addEventListener('click', endTour);
  card.querySelector('[data-tournext]').addEventListener('click', ()=> showStep(i + 1));
}

let stepToken = 0;

async function showStep(i){
  if(i >= TOUR.length){ endTour(); return; }
  const my = ++stepToken;
  tourIdx = i;
  const st = TOUR[i];
  const card = document.getElementById('tourCard');

  
  if(st.hideCard) card.classList.remove('on');
  drawTourCard(i);
  if(!st.hideCard) card.classList.add('on');

  if(st.preSel){
    const pre = document.querySelector(st.preSel);
    if(pre){
      applyHole(pre.getBoundingClientRect(), st.pad == null ? 8 : st.pad);
      await delay(340);
    }
  }

  const pad = st.pad == null ? 8 : st.pad;

  
  let trackP = null;
  if(st.sel && !st.rect) trackP = trackFor(st.sel, pad, st.track || 1100);

  try{
    if(st.before){
      const p = st.before();
      if(p && typeof p.then === 'function') await p;
    }
  }catch(err){}
  if(trackP) await trackP;
  if(my !== stepToken) return;        
  await delay(st.wait || 90);
  if(my !== stepToken) return;

  let r = null;
  if(st.rect){
    r = st.rect();
  }else{
    const el = document.querySelector(st.sel);
    if(!el){ showStep(i + 1); return; }
    r = await settleRect(el, 900);
  }
  if(!r || r.width < 4 || r.height < 4){ showStep(i + 1); return; }

  applyHole(r, pad, st.sel === '#deck' ? '24px' : '12px');

  placeTour(r);
  card.classList.add('on');
}

function startTour(){
  tourActive = true;
  tourIdx = 0;
  document.getElementById('tourMask').hidden = false;
  const hole = document.getElementById('tourHole');
  hole.hidden = false;
  hole.style.opacity = '0';
  requestAnimationFrame(()=>{ hole.style.opacity = '1'; });
  document.getElementById('tourCard').hidden = false;
  showStep(0);
}

function endTour(){
  if(!tourActive) return;
  tourActive = false;
  const hole = document.getElementById('tourHole');
  const card = document.getElementById('tourCard');
  card.classList.remove('on');
  hole.style.opacity = '0';
  setTimeout(()=>{
    document.getElementById('tourMask').hidden = true;
    hole.hidden = true;
    card.hidden = true;
  }, 260);
  document.getElementById('sideRail').classList.remove('open');
  try{ localStorage.setItem('codexTourV2', '1'); }catch(e){}
  toast('随时点右下角「?」重看指南');
}

function initTour(){
  document.getElementById('tourFab').addEventListener('click', ()=> startTour());
  window.addEventListener('resize', ()=>{
    if(!tourActive) return;
    const st = TOUR[tourIdx];
    const el = document.querySelector(st.sel);
    if(el) placeTour(el.getBoundingClientRect());
  });
  const forced = /(?:\?|&)tour=1/.test(location.search);
  let seen = null;
  try{ seen = localStorage.getItem('codexTourV2'); }catch(e){}
  if(forced || !seen) setTimeout(()=> startTour(), 1500);
}




function initStage(){
  const stage = document.getElementById('stage');

  stage.addEventListener('wheel', (e)=>{
    if(state.open){
      const body = document.querySelector('.detail-body');
      if(body){
        const atTop = body.scrollTop <= 0 && e.deltaY < 0;
        const atEnd = body.scrollTop + body.clientHeight >= body.scrollHeight - 2 && e.deltaY > 0;
        if(!atTop && !atEnd) return;
      }
    }
    e.preventDefault();
    const now = Date.now();
    if(now - lastWheel < 620) return;
    lastWheel = now;
    if(e.deltaY > 0) flipNext(); else flipPrev();
  }, { passive:false });

  let sx = null, sy = null;
  stage.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.detail') || e.target.closest('.rail')) return;
    sx = e.clientX; sy = e.clientY;
  });
  window.addEventListener('pointerup', (e)=>{
    if(sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx < 0) flipNext(); else flipPrev();
    }
  });

  window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){ if(tourActive){ endTour(); return; } closeAI(); closeDetail(false); closeSheet(); hidePlaceholder(); }
    if(state.open){
      if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
        const d = document.getElementById('detail');
        switchSub(+(d.dataset.si || 0) + (e.key === 'ArrowRight' ? 1 : -1));
        e.preventDefault();
      }
      return;
    }
    if(e.key === 'ArrowRight') flipNext();
    if(e.key === 'ArrowLeft') flipPrev();
  });

  document.getElementById('deck').addEventListener('click', (e)=>{
    const card = e.target.closest('.lcard');
    if(!card || card.classList.contains('tear')) return;
    if(card.id !== 'c0'){ flipNext(); return; }
    const li = e.target.closest('.subs li');
    if(li) openDetail(+li.dataset.sub);
  });

  document.getElementById('phClose').addEventListener('click', hidePlaceholder);
  document.getElementById('ph').addEventListener('click', (e)=>{
    if(e.target.id === 'ph') hidePlaceholder();
  });
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('on'), 1900);
}

function showHint(){
  const h = document.getElementById('hint');
  h.classList.add('on');
  setTimeout(()=> h.classList.remove('on'), 4200);
}




load();
renderStack();
syncProgress();
initSide();
initDock();
initSheet();
initStage();
initAI();
initTour();
setTimeout(showHint, 700);
</script>
